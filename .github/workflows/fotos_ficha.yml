name: Fotos reais para a ficha visual
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fotos-ficha
  cancel-in-progress: false
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Baixar candidatas
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/baixar_fotos_ficha.py data/produtos/ficha_modelo/fotos_cand
      - name: Gravar
        run: |
          git config user.name "Fabrica Tutorial Pet"
          git config user.email "fabrica@users.noreply.github.com"
          git add data/produtos/ficha_modelo/fotos_cand
          git commit -m "ficha: candidatas de foto real (Pexels)" || echo nada
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep 5; done
