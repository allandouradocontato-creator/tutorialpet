name: Listar vozes ElevenLabs (uso unico)

# Procura a voz da Duda ("Marianne") na conta da ElevenLabs e mostra nome + ID da voz no log.
# O ID da voz nao e segredo. A chave nunca e impressa. Rode uma vez e pode apagar este arquivo depois.
on:
  workflow_dispatch:
    inputs:
      busca:
        description: "parte do nome da voz"
        required: false
        default: "Marianne"

permissions:
  contents: read

jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Procurar voz
        env:
          ELEVENLABS_API_KEY: ${{ secrets.TUTORIALPETELEVENLABS || secrets.ELEVENLABS_API_KEY }}
          BUSCA: ${{ github.event.inputs.busca }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          chave = os.environ.get("ELEVENLABS_API_KEY", "").strip()
          busca = (os.environ.get("BUSCA") or "Marianne").strip().lower()
          if not chave:
              raise SystemExit("sem chave nos secrets (TUTORIALPETELEVENLABS / ELEVENLABS_API_KEY)")
          print(f"chave: comeca com sk_? {chave.startswith('sk_')} | tamanho={len(chave)} | tem espaco/quebra de linha? {any(c.isspace() for c in chave)}")
          achou = False
          for url in ("https://api.elevenlabs.io/v2/voices?page_size=100&search=" + busca,
                      "https://api.elevenlabs.io/v1/voices"):
              try:
                  req = urllib.request.Request(url, headers={"xi-api-key": chave})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      d = json.load(r)
              except urllib.error.HTTPError as e:
                  corpo = ""
                  try:
                      corpo = e.read().decode("utf-8", "replace")[:300].replace(chave, "***")
                  except Exception:
                      pass
                  print(f"{url.split('?')[0]} -> HTTP {e.code} | motivo: {corpo}")
                  continue
              except Exception as e:
                  print(f"{url.split('?')[0]} -> {type(e).__name__}")
                  continue
              vozes = d.get("voices", [])
              print(f"{url.split('?')[0]} -> {len(vozes)} voz(es) na lista")
              for v in vozes:
                  if busca in (v.get("name") or "").lower():
                      achou = True
                      print(f"VOZ: {v.get('name')} | voice_id={v.get('voice_id')} | categoria={v.get('category')}")
              if achou:
                  break
          if not achou:
              print("Nenhuma voz com esse nome. Abra a voz na ElevenLabs e copie o ID manualmente.")
          PY
