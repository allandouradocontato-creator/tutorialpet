name: Publicar Blog Tutorial Pet

# Dispara quando o Publicador (Claude) grava "<slug> <indice_da_foto>" em config/blog_aprovados.txt,
# ou à mão (Run workflow). Roda editor de qualidade -> SEO -> capa -> site/build e publica na main
# (o Cloudflare Pages publica o site a partir da main).
on:
  push:
    branches: [main]
    paths: ["config/blog_aprovados.txt"]
  workflow_dispatch:
    inputs:
      slug:
        description: "slug do artigo"
        required: false
      indice:
        description: "indice da foto candidata (0, 1, 2...)"
        required: false

permissions:
  contents: write

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Codigo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install pyyaml

      - name: Fotos candidatas (branch media)
        run: git clone --depth 1 --branch media "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/media

      - name: Publicar artigo no site
        env:
          SLUG: ${{ github.event.inputs.slug }}
          INDICE: ${{ github.event.inputs.indice }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -n "$SLUG" ] && [ -n "$INDICE" ]; then
            python blog_publicar_nuvem.py /tmp/media "$SLUG" "$INDICE"
          else
            python blog_publicar_nuvem.py /tmp/media
          fi

      - name: Gravar na main (Cloudflare publica)
        # 20/10: se UM artigo era reprovado pelo editor, o passo anterior saia com erro e este passo era PULADO:
        # os artigos aprovados ficavam fora do ar (ultimo post no ar: 16/10). Agora grava sempre; o job continua vermelho (alerta).
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Fabrica Tutorial Pet"
          git config user.email "fabrica@tutorialpet.com.br"
          git add site/build data/quality_editor data/seo_onpage data/visual config/blog_aprovados.txt config/blog_reprovados.txt config/capas_pendentes.txt
          git commit -m "blog: publica artigo $(date -u +%F)" || echo "nada a commitar"
          # 16/10: o rebase falhava com 'unstaged changes' e os artigos nao iam ao ar. Autostash + 3 tentativas;
          # se ainda falhar, o passo quebra com mensagem clara (nada de erro silencioso).
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && ok=1 && break
            echo "tentativa $i falhou; aguardando"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::push do publicar_blog falhou 3x: artigos NAO foram ao ar"; exit 1; }

      - name: Alerta (abre uma issue se o publicar_blog falhou)
        # 20/10: o blog ficou parado de 16 a 20/10 e ninguem soube. Falha aqui agora gera issue (e o Vigia le as issues).
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Blog nao publicou em $(date -u +%F)" --body "Rodada: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Veja o passo que falhou; artigos aprovados podem ter ficado fora do ar." || echo "::warning::nao consegui abrir a issue"
