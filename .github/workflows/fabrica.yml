name: Fabrica Tutorial Pet

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 em Fortaleza: pacote do turno A (publica 10h FB, 12h TikTok, 14h IG)
    - cron: "0 15 * * *"  # 12:00 em Fortaleza: pacote do turno B (publica 17h FB, 18h TikTok, 20h IG). 2 vídeos/dia: decisão do Allan 08/10/2026 (recomendação do Especialista TikTok)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Codigo da fabrica
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          pip install pyyaml requests edge-tts
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Pasta de entrega (branch media)
        run: |
          git clone --depth 1 --branch media "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/media

      - name: Produzir artigo, roteiro e video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.TUTORIALPETELEVENLABS || secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          WRITER_MODE: llm
          CLIPS_REGISTRO: /tmp/media/clips_usados.json   # variedade: clipes e músicas já usados (fica na branch media)
          DUDA_ESTADO: /tmp/media/estado_duda   # rodízio de ganchos e CTAs (fica na branch media; antes recomeçava do zero todo dia)
        run: |
          set -o pipefail
          python fabrica_nuvem.py /tmp/media 2>&1 | tee /tmp/producao.log

      - name: Repor fila de temas (agente 19; nao derruba a fabrica se falhar)
        continue-on-error: true
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agents/19_validador_tema/agent.py --repor 5 || echo "::warning::reposicao de temas falhou; fila segue como estava"

      - name: Curadoria do artigo (agente 24; aviso, nao derruba a rodada)
        continue-on-error: true
        run: |
          python agents/24_curador_blog/agent.py | head -40

      - name: Auditoria do processo (agente 25; so avisa, nao derruba a rodada)
        continue-on-error: true
        run: |
          python agents/25_auditor_processo/agent.py /tmp/media | tee /tmp/auditoria.md
          [ -f data/auditoria/ultimo.md ] && cat data/auditoria/ultimo.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardião de marca e variedade (agente 26; só avisa e marca o pacote, não derruba a rodada)
        continue-on-error: true
        env:
          CLIPS_REGISTRO: /tmp/media/clips_usados.json
        run: |
          python agents/26_guardiao_marca/agent.py /tmp/media | tee /tmp/guardiao.md
          [ -f data/auditoria/guardiao.md ] && cat data/auditoria/guardiao.md >> "$GITHUB_STEP_SUMMARY"

      - name: Aprovar sozinho o pacote que o Guardiao liberou (sem Guardiao ok, fica aguardando revisao)
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, glob, os
          ultimo = max(glob.glob("/tmp/media/pacotes/*/manifest.json"), key=os.path.getmtime)
          m = json.load(open(ultimo, encoding="utf-8"))
          if (m.get("guardiao") or {}).get("status") == "ok" and m.get("status") == "aguardando_revisao":
              m["status"] = "aprovado"; m["aprovado_por"] = "auto (Guardiao ok)"
              json.dump(m, open(ultimo, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              print("aprovado:", ultimo)
          else:
              print("NAO aprovado automaticamente:", (m.get("guardiao") or {}).get("status"), m.get("status"))
          PY

      - name: Entregar pacote (branch media)
        run: |
          cd /tmp/media
          git config user.name "Fabrica Tutorial Pet"
          git config user.email "fabrica@tutorialpet.com.br"
          git add -A
          git commit -m "pacote diario $(date -u +%F)" || echo "nada a commitar"
          git push origin media

      - name: Guardar fila e rascunhos (main)
        run: |
          git config user.name "Fabrica Tutorial Pet"
          git config user.email "fabrica@tutorialpet.com.br"
          git add config/fila_temas.yaml data/content_writer data/social/roteiros data/biblioteca data/auditoria || true
          git commit -m "fabrica: fila e rascunhos $(date -u +%F)" || echo "nada a commitar"
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main; then :; else
              git rebase --abort || true
              rm -rf /tmp/fila_bak && mkdir -p /tmp/fila_bak
              cp -r --parents config/fila_temas.yaml data/content_writer data/social/roteiros data/biblioteca data/auditoria /tmp/fila_bak/ 2>/dev/null || true
              git reset -q --hard origin/main
              cp -r /tmp/fila_bak/. . 2>/dev/null || true
              git add config/fila_temas.yaml data/content_writer data/social/roteiros data/biblioteca data/auditoria || true
              git commit -m "fabrica: fila e rascunhos $(date -u +%F)" || true
            fi
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((i*5))
          done
          [ "$ok" = 1 ] || { echo "::error::push da fila no main falhou 5x"; exit 1; }

      - name: Saude da fabrica (falha de verdade se o pacote estiver ruim)
        if: always()
        env:
          WRITER_MODE: llm
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set +e
          python agents/18_saude_fabrica/agent.py /tmp/media
          code=$?
          [ -f data/saude/ultimo.md ] && cat data/saude/ultimo.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Alerta (abre uma issue no GitHub se qualquer passo falhou)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          corpo="A fabrica de $(date -u +%F) falhou.\n\nRodada: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n$(cat data/saude/ultimo.md 2>/dev/null)\n\nFim do log da producao:\n$(tail -n 40 /tmp/producao.log 2>/dev/null | cut -c1-300)"
          gh issue create --title "Fabrica falhou em $(date -u +%F)" --body "$(printf '%b' "$corpo")" || echo "::warning::nao consegui abrir a issue"
