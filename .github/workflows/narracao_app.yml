name: Narracao do video do app (voz da Duda)
# Gera um mp3 por fala de data/video_app/falas.json com a voz oficial (config/voz_elevenlabs.yaml), com o tempo de cada palavra,
# e guarda na branch media em video_app/${PASTA}/. Gasta ~1 credito por caractere. A chave nunca e impressa.
on:
  workflow_dispatch:
    inputs:
      voz:
        description: "voice id (vazio = voz da Duda)"
        required: false
        default: ""
      pasta:
        description: "subpasta de saida em video_app/ (ex.: narracao_lily)"
        required: false
        default: "narracao"
      so:
        description: "chaves das falas a gerar, separadas por virgula (vazio = todas)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  narrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Gerar falas
        env:
          ELEVENLABS_API_KEY: ${{ secrets.TUTORIALPETELEVENLABS || secrets.ELEVENLABS_API_KEY }}
          SO: ${{ github.event.inputs.so }}
          ELEVENLABS_VOICE_ID: ${{ github.event.inputs.voz }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, sys
          from pathlib import Path
          sys.path.insert(0, "agents/17_video")
          spec = importlib.util.spec_from_file_location("mv6", "agents/17_video/montar_video6.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          falas = json.load(open("data/video_app/falas.json"))
          out = Path("narracao"); out.mkdir(exist_ok=True)
          tempos = {}
          so = [x.strip() for x in os.environ.get('SO','').split(',') if x.strip()]
          if (out / 'tempos.json').exists(): tempos = json.load(open(out / 'tempos.json'))
          for k, texto in falas.items():
              if so and k not in so: continue
              pal = m._tts_elevenlabs(texto, out / f"fala_{k}.mp3")
              if pal is None:
                  raise SystemExit(f"falhou na fala {k}")
              tempos[k] = pal
              print("ok", k, len(texto), "caracteres")
          json.dump(tempos, open(out / "tempos.json", "w"), ensure_ascii=False)
          PY
      - name: Guardar na branch media
        env:
          PASTA: ${{ github.event.inputs.pasta }}
        run: |
          git config user.name "fabrica"; git config user.email "fabrica@users.noreply.github.com"
          mkdir -p /tmp/narracao_novo && cp narracao/fala_*.mp3 /tmp/narracao_novo/ && cp narracao/tempos.json /tmp/tempos_novo.json
          git fetch origin media
          git checkout -f media
          mkdir -p video_app/${PASTA}
          python3 - <<'PY'
          import json, os, shutil
          novo = json.load(open('/tmp/tempos_novo.json'))
          dest = 'video_app/' + os.environ['PASTA'] + '/tempos.json'
          velho = json.load(open(dest)) if os.path.exists(dest) else {}
          velho.update(novo); json.dump(velho, open(dest, 'w'), ensure_ascii=False)
          PY
          cp /tmp/narracao_novo/fala_*.mp3 video_app/${PASTA}/
          git add video_app && git commit -m "narracao do video do app (voz da Duda)" && git push origin media
