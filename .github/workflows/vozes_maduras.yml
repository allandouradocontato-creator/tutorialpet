name: Buscar vozes femininas maduras pt-BR (uso unico)
# Lista vozes da biblioteca compartilhada da ElevenLabs (pt, feminina, meia-idade) com nome, id, descricao e uso. A chave nunca e impressa.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          K: ${{ secrets.TUTORIALPETELEVENLABS || secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          k = os.environ["K"].strip()
          try:
              r = urllib.request.Request("https://api.elevenlabs.io/v1/voices", headers={"xi-api-key": k})
              d = json.load(urllib.request.urlopen(r, timeout=30))
          except Exception as e:
              print("erro", e); d = {}
          for v in d.get("voices", []):
              l = v.get("labels") or {}
              if l.get("gender") == "female":
                  print(v.get("voice_id"), "|", v.get("name"), "|", l.get("age"), "|", l.get("accent"), "|", l.get("descriptive") or l.get("descriptions"), "|", l.get("use_case"), "|", v.get("category"))
          PY
