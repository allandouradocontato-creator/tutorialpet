name: Buscar ofertas Shopee
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: python agents/28_buscador_ofertas/agent.py
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      - run: |
          git config user.name "fabrica"; git config user.email "fabrica@users.noreply.github.com"
          git add data/ofertas && (git diff --cached --quiet || git commit -m "ofertas: busca semanal Shopee") && git pull -q --rebase && git push || true
