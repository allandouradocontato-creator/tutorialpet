name: Teste Cloudflare Pages (API)

# Teste unico (22/10): o CF_API_TOKEN que ja existe enxerga o projeto Pages e consegue listar/criar deploy?
# Nao imprime segredo; so codigos HTTP e hash do ultimo deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Listar deploys do projeto
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/dep.json -w "%{http_code}" -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/tutorialpet/deployments?per_page=2")
          echo "listar deploys: HTTP $code"
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("/tmp/dep.json"))
          except Exception as e:
              print("resposta nao-JSON:", e); raise SystemExit(0)
          print("success:", d.get("success"), "erros:", [e.get("message") for e in d.get("errors", [])])
          for x in (d.get("result") or [])[:2]:
              t = x.get("deployment_trigger", {}).get("metadata", {})
              print("deploy", x.get("id", "")[:8], x.get("created_on"), "commit", (t.get("commit_hash") or "")[:7], x.get("latest_stage", {}).get("status"))
          PY
