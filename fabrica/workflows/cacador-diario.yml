name: Cacador diario de ofertas
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"   # 06:00 America/Fortaleza (UTC-3)
permissions:
  contents: write
jobs:
  cacar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python agents/33_cacador_diario/agent.py
      - run: |
          git config user.name "fabrica"; git config user.email "fabrica@users.noreply.github.com"
          git add data/cacador && (git diff --cached --quiet || git commit -m "cacador: prateleira do dia") && git pull -q --rebase && git push || true
