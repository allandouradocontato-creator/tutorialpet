# Linha editorial do Tutorial Pet — definida pelo Allan em 07/10/2026.
# Antes: foco em "tutores de primeira viagem". Agora: todos os tutores de cães e gatos.
publico: "todos os tutores de cães e gatos"
perfis:
  - iniciante (chegada do pet, enxoval, primeiros meses)   # no máximo 1 em cada 4 artigos
  - tutor experiente (comportamento, rotina, enriquecimento ambiental)
  - filhote (socialização, vacinas de calendário, educação básica, sempre com veterinário)
  - adulto e idoso (rotina, conforto, mudanças da idade, sempre com veterinário)
  - casa com vários pets e/ou crianças
  - tutor que trabalha fora (rotina, ficar sozinho — liga com o produto Sozinho em Casa)
regras:
  - não colocar "primeira viagem" no título, salvo tema de chegada do pet
  - o primeiro artigo de apresentação do site ("comece aqui") continua sendo para quem está chegando
  - assinatura continua "Equipe Tutorial Pet"; nada de diagnóstico, dose ou tratamento
