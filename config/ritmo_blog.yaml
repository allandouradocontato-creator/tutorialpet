# Ritmo do blog (Allan, 22/10/2026; REVISADO em 28/10/2026 na correcao do AdSense):
# FIXO em 3 artigos por dia, todo dia (antes variava 3 e 4 por paridade do dia do ano). Fonte unica da regra.
inicio: 2026-10-22
fim: 2026-11-18            # 4 semanas de teste; depois vira o molde dos proximos blogs
artigos_por_dia: 3         # fixo; slots da fabrica.yml: 06h, 10h e 14h (Fortaleza). Sem 4a producao.
minimo_sempre: 3           # nenhum dia abaixo disso; abaixo = ALERTA do Vigia
formatos_rodizio:          # variar o formato, nao so o tema; cada dia usa 2+ formatos diferentes
  - guia_passo_a_passo
  - pergunta_resposta_curta   # "Pode dar X? Sim/Nao e por que"
  - comparativo_escolha       # como escolher A vs B (afiliado com valor proprio)
  - checklist
  - mito_ou_verdade
  - pet_celebridade           # quinta, 1 por semana
  - resposta_de_pergunta_real # nasce de pergunta publica com fonte (Search Console, PAA); enquete so com audiencia (>=300 seguidores)
# RODIZIO DE PILARES (28/10/2026): os 5 pilares do site, nesta ordem de volta. Nunca dois artigos seguidos do mesmo pilar
# (nem entre o ultimo de um dia e o primeiro do dia seguinte). Quem aplica: rotina_diaria.py (escolha do proximo tema da fila).
pilares_rodizio: [cuidados_diarios, alimentacao, comportamento, primeiros_passos_filhotes, produtos_compras]
# SERIES PRIORITARIAS (28/10/2026, Allan): adocao e utilidade_publica entram 1 artigo/dia cada enquanto houver pendente da serie
# (12 + 12 = ~12 dias); o 3o slot do dia segue o rodizio dos 5 pilares originais. Depois da serie, entram no rodizio normal.
pilares_prioritarios: [adocao, utilidade_publica]
cota_prioritario_dia: 1
regra_pilar: "nunca 2 seguidos do mesmo pilar; escolhe o pendente do pilar usado ha mais tempo; os 3 do dia saem de 3 pilares diferentes"
