# Configuração do agente 15 (imagem de capa via banco de imagens). Nenhuma credencial fica
# aqui — as chaves vêm só de PEXELS_API_KEY / PIXABAY_API_KEY no .env.
#
# Decisão revista: geração por IA (OpenAI) trocada por banco de imagens (Pexels/Pixabay),
# para não depender de billing e ter imagem publicável no mesmo dia. Regra inegociável:
# toda foto tem que mostrar só o animal, nunca uma pessoa/tutor visível — por isso a
# seleção final é sempre revisada visualmente antes de publicar (ver agents/15_visual/agent.py).

candidatos_por_busca: 5   # quantas fotos candidatas baixar por artigo, para dar opção de escolha
licencas_aceitas: [pexels, pixabay]   # ambas: uso comercial livre, sem exigência formal de atribuição

# Mesmo sem exigência formal de atribuição, aplicamos crédito ao fotógrafo como boa prática
# editorial (também ajuda a mostrar transparência numa eventual revisão do AdSense).
aplicar_credito_fotografo: true
