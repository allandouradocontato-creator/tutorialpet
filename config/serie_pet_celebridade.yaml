# Série semanal "Pet Celebridade da Semana" (ideia do Allan, 14/10/2026)
# Um artigo por semana: o pet de um artista brasileiro + a raça + a relação deles. Ligado a um produto/afiliado do catálogo.
serie:
  nome: "Pet Celebridade da Semana"
  frequencia: semanal
  dia_publicacao: quinta        # sugestão; o Estrategista de Redes ajusta ao pico de audiência
  pilar_do_blog: comportamento  # ajustar por tema (raça -> cuidados / alimentação)
  estrutura_do_artigo:
    - "Quem é o pet (nome, idade, raça) e quem é o tutor famoso"
    - "Como eles convivem (rotina, passeios, onde dorme), só com o que o tutor disse em público"
    - "Tudo sobre a raça: origem, temperamento, tamanho, expectativa de vida, cuidados, saúde"
    - "O que o pet mudou na vida do artista (nas palavras dele, com link da fonte)"
    - "Para o seu pet: 3 lições práticas + link para o artigo do blog / produto relacionado"
  regras:
    - "NOMENCLATURA (ordem do Allan, 15/10/2026): no blog e nas redes a série se chama 'Pet Celebridade · Celebrity Pets'; escrever 'o pet da Anitta' ou 'o melhor amigo da Anitta'. NÃO usar a palavra 'cão' (em português tem outros sentidos); usar 'pet', 'cachorro' ou 'melhor amigo'. Frontmatter do artigo: serie: pet-celebridade, artista, pet_nome, pet_raca (aparecem no selo do artigo e na seção da home)."
    - "Só fatos públicos com link da fonte (entrevista, matéria, rede social oficial do artista). Nada inventado."
    - "Sem frases entre aspas que o artista não tenha dito; citação curta (até 15 palavras) com fonte ou paráfrase."
    - "FOTOS (ordem do Allan, 15/10/2026): o artigo deve mostrar o artista e o pet REAIS, com o nome do artista em destaque no título e no selo. Só por caminho legal: (1) foto com licença livre (Wikimedia Commons, CC BY/CC BY-SA ou domínio público) com crédito e link da licença; (2) incorporação OFICIAL da publicação do artista ou do pet no Instagram/TikTok (embed, só carrega no clique); (3) foto enviada pelo assessor com autorização escrita. Nunca copiar foto de agência (Getty, etc.), de portal de notícia nem print de rede social. Sem nenhuma dessas, usar foto de banco da mesma raça e marcar 'Foto ilustrativa: não é o animal citado' (frontmatter foto_ilustrativa: true). Foto do artista só em contexto editorial: nunca em anúncio, vídeo de venda ou post que sugira que ele aprova o Tutorial Pet ou o Sozinho em Casa."
    - "Sem sugerir que o artista aprova o blog ou os produtos. Deixar claro que é conteúdo editorial."
    - "Não incluir vida privada além do pet; não citar menores de idade; cuidado com notícia de morte de pet (tom respeitoso)."
    - "Conferir a fonte antes de publicar: o Auditor de Processo checa links e datas."
  fontes_preferidas: ["g1", "UAI", "CNN Brasil", "Purepeople", "Quem", "Instagram oficial do artista"]
  fila_de_candidatos:           # o agente de marketing preenche: artista, pet, raça, link da fonte
  - ordem: 1
    status: piloto_liberado_14_10   # Allan liberou o piloto para esta semana
    artista: Anitta
    pet: Plínio
    raca: galgo italiano
    fatos_conferidos: "7 anos; perfil próprio no Instagram (+200 mil seguidores); Pet do Ano no MTV Miaw 2019; looks da costureira Zilda Carvalho"
    fonte: https://www.cnnbrasil.com.br/pop/conheca-6-caes-de-famosos-que-chamam-a-atencao-nas-redes-sociais/
    artigo_do_blog_ligado: "cuidados com galgo/raças de pelo curto e frio; escolher no catalogo_tema_produto.yaml"
    observacao: "Conferir segunda fonte (Instagram oficial do pet) antes de publicar; sem foto da artista."
  - ordem: 2
    artista: Latino
    pet: Twelves (macaco)
    observacao: "Pedido do Allan. ATENÇÃO: o macaco morreu em 2026 e há críticas de organização de proteção animal; a série não pode promover animal silvestre como pet. Ângulo sugerido: o que a história ensina (por que macaco não é pet) com tom respeitoso. Decidir com o Allan antes de produzir."
  - ordem: 3
    artista: Xuxa
    pet: Doralice
    raca: yorkshire
    fonte: https://www.cnnbrasil.com.br/pop/conheca-6-caes-de-famosos-que-chamam-a-atencao-nas-redes-sociais/
    status: rascunho_pronto_22_10   # edição de 22/10; rascunho em data/content_writer/rascunhos/yorkshire-temperamento-e-cuidados-da-raca-da-doralice-pet-da-xuxa.md
    fatos_conferidos: "Doralice viva e ativa (UAI 26/08/2026): acompanha Xuxa em podcasts/eventos; Xuxa contou que ela fica ansiosa longe dela. CNN 26/08/2024: 7 anos, Orlando/Disney, adotada por Maria do Rosário. A morte de agosto/2026 foi do Theozinho (yorkshire de Junno Andrade e Xuxa), não da Doralice (UAI 20/08/2026); não citado no artigo."
    observacao: "Fotos: ilustrativa de yorkshire (banco), sem foto da artista nem da Doralice sem licença."
  - ordem: 4
    artista: Luísa Sonza
    pet: Giselle
