    fonte: https://www.uai.com.br/app/entretenimento/famosos/2026/08/26/not-famosos,389699/de-pets-a-celebridades-os-cachorros-dos-famosos-que-viraram-sensacao.shtml
    observacao: "Inspirou a música Cachorrinhas e a capa da revista Dogue Brasil (UAI). Conferir 2ª fonte; ligar a cuidados com raça pequena/frio."
