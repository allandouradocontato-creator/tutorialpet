    fonte: https://www.cnnbrasil.com.br/pop/conheca-6-caes-de-famosos-que-chamam-a-atencao-nas-redes-sociais/
    observacao: "Edição com gato para variar; raça não informada na CNN (Band 08/2025 cita Sonza entre famosos com gatos). Se não achar raça, usar foto_ilustrativa e tema 'gato de apartamento'."
  - ordem: 7
    artista: Marina Ruy Barbosa
    pet: a confirmar (cachorro dálmata adotado)
    raca: dálmata
    fonte: https://www.purepeople.com.br/noticia/marina-ruy-barbos-exibe-novo-cachorro-apos-adocao-e-entrega-detalhe-curioso_a317454/1
