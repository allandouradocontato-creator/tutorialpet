# Série semanal "Pet Celebridade da Semana" (ideia do Allan, 14/10/2026)
# Um artigo por semana: o pet de um artista brasileiro + a raça + a relação deles. Ligado a um produto/afiliado do catálogo.
serie:
  nome: "Pet Celebridade da Semana"
  frequencia: semanal
  dia_publicacao: quinta        # sugestão; o Estrategista de Redes ajusta ao pico de audiência
  pilar_do_blog: comportamento  # ajustar por tema (raça -> cuidados / alimentação)
  estrutura_do_artigo:
    - "Quem é o pet (nome, idade, raça) e quem é o tutor famoso"
    - "Como eles convivem (rotina, passeios, onde dorme), só com o que o tutor disse em público"
    - "Tudo sobre a raça: origem, temperamento, tamanho, expectativa de vida, cuidados, saúde"
    - "O que o pet mudou na vida do artista (nas palavras dele, com link da fonte)"
    - "Para o seu pet: 3 lições práticas + link para o artigo do blog / produto relacionado"
  regras:
    - "Só fatos públicos com link da fonte (entrevista, matéria, rede social oficial do artista). Nada inventado."
    - "Sem frases entre aspas que o artista não tenha dito; citação curta (até 15 palavras) com fonte ou paráfrase."
    - "Sem foto do artista (direito de imagem). Imagem de capa = banco de fotos, raça igual ou parecida, com gente feliz."
    - "Sem sugerir que o artista aprova o blog ou os produtos. Deixar claro que é conteúdo editorial."
    - "Não incluir vida privada além do pet; não citar menores de idade; cuidado com notícia de morte de pet (tom respeitoso)."
    - "Conferir a fonte antes de publicar: o Auditor de Processo checa links e datas."
  fontes_preferidas: ["g1", "UAI", "CNN Brasil", "Purepeople", "Quem", "Instagram oficial do artista"]
  fila_de_candidatos: []        # o agente de marketing preenche: artista, pet, raça, link da fonte
  ligacao_com_produto: "cada edição aponta para o artigo do blog da raça/tema e para o produto do catálogo (config/catalogo_tema_produto.yaml)"
