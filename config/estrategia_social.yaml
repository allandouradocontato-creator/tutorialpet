# Estratégia social (Estrategista de Redes Sociais, 16/10/2026 11:29). Só recomendação: nada aqui publica ou agenda sozinho.
# Fontes: Zernio (FB, IG) e Buffer (TikTok). Metricool descontinuado em 13/10. Plano de mudança: data/social/plano_de_mudanca_16_10.md
versao: 8
atualizado_em: "2026-10-16"
status_publicacao:
  alerta: "Sem erros em 16/10. Zernio >=30 agendados FB/IG; Buffer 9 agendados TikTok (teto gratis = 10). 5 legendas TikTok agendadas dizem 'link no perfil' (areia, banho, piso, racao seca, cotonete): trocar por 'busque no blog'."
  teste_horarios_ab: "ENCERRADO como fator de decisao em 16/10 (8 posts por rede sem sinal; mesmo video de 40-55s nos 3 slots). Horarios congelados; o fator agora e formato/abertura."
  buffer_metricas_por_post: "list_posts includeMetrics=true entrega views/curtidas/tempo medio por post do TikTok"
horarios:
  regra: "Slots fixos todos os dias; nunca duas redes no mesmo horario. CONGELADOS (nao testar horario agora)."
  facebook: {manha: "10:00", tarde: "14:00", noite: "19:00", meme: "12:00"}
  tiktok: {manha: "10:20", tarde: "14:20", noite: "20:20", meme_curto: "17:10"}
  instagram: {manha: "11:00", tarde: "15:00", noite: "20:00", meme: "13:00"}
  grade_2_melhores: {facebook: ["10:00", "19:00"], instagram: ["11:00", "20:00"], tiktok: ["10:20", "20:20"]}
  dias: [seg, ter, qua, qui, sex, sab, dom]
  base: "Nossos dados (n pequeno, parciais): FB 10h ~210, 19h ~240; IG 11h 55-67, 20h 39-101. Zernio best_time inconclusivo. Benchmark Metricool PT jul/2026: FB 10-14h; IG/TikTok pico 18-21h."
hashtags:
  quantidade: {instagram: "3-5", tiktok: "3-5", facebook: "0-3 (cortar de 5 para 3)"}   # Metricool, 29/06/2026, metricool.com/how-many-hashtags-to-use
  estrutura: "1 de marca (#tutorialpet) + 1 do tema + 1-2 de nicho + 1 ampla (ampla so IG/TikTok); nunca #fyp #viral #explorar"
  gato: ["#gatos", "#cuidadoscomgatos", "#saudefelina", "#dicasdegato", "#tutorialpet"]
  cachorro: ["#cachorro", "#cachorros", "#cuidadospet", "#dicaspet", "#tutorialpet"]
  filhote: ["#filhotes", "#filhotedecachorro", "#primeirospassos", "#cachorros", "#tutorialpet"]
  ansiedade_separacao: ["#ansiedadedeseparacao", "#comportamentocanino", "#cachorrosozinho", "#cachorro", "#tutorialpet"]
  saude_alimentacao: ["#saudepet", "#alimentacaopet", "#cuidadospet", "#pets", "#tutorialpet"]
  humor: ["#humorpet", "#gatos", "#cachorros", "#tutorialpet"]
  nota: "Pet BR: sem fonte aberta do que funciona; hashtag do animal tem de bater com o tema do artigo. FB usa as 3 primeiras do conjunto."
cta_artigo: "Confira o artigo completo em tutorialpet.com.br"
cta_regras: "Link clicavel so no PRIMEIRO COMENTARIO (FB/IG). TikTok: digitar o dominio; NAO escrever 'link no perfil/na bio' (nao confirmado). Sem alegacao medica ('pode ser fatal', 'atrapalhando o crescimento'); saude = consulte o veterinario."
modelos_legenda:   # {gancho}=pergunta do video; {valor}=1 linha de utilidade
  facebook:
    - "{gancho}\n{valor}\n{pergunta}\n{cta_artigo}\n{hashtags_ate_3}"
    - "{gancho}\nSalve para ver depois: {valor}\nVocê já passou por isso? Conta aqui.\n{cta_artigo}\n{hashtags_ate_3}"
    - "{gancho}\n{valor}\nQual é o maior desafio com o seu {animal} nisso? Conta aqui.\n{cta_artigo}\n{hashtags_ate_3}"
  instagram:
    - "{gancho} {emoji}\n\n{valor}\n\n{pergunta}\n\n{cta_artigo}\n\n{hashtags_3a5}"
    - "{gancho}\n\n{valor} Salva esse Reels para lembrar.\n\nQual dessas opções é a do seu {animal}? Responde nos comentários.\n\n{cta_artigo}\n\n{hashtags_3a5}"
    - "{gancho}\n\n{valor}\n\nManda para quem cuida de um {animal} com você.\n\n{cta_artigo}\n\n{hashtags_3a5}"
  tiktok:
    - "{gancho} {valor_curto} {pergunta_curta} {cta_artigo} {hashtags_3a5}"
    - "{gancho} Salva esse vídeo. {pergunta_curta} {cta_artigo} {hashtags_3a5}"
    - "{gancho} {valor_curto} Manda pra quem precisa ver. {cta_artigo} {hashtags_3a5}"
  tiktok_opcoes: {isAigc: true, commercialContentOwnBrand: "ligar quando o video citar o Sozinho em Casa"}
perguntas_interacao:
  gato:
    - "Seu gato prefere água corrente ou da tigela?"
    - "Qual é o esconderijo preferido do seu gato: caixa, armário ou cama?"
    - "Quantos gatos moram com você?"
    - "Seu gato é do tipo que acorda você de manhã? Sim ou não?"
    - "Qual planta da sua casa seu gato mais tenta morder?"
  cachorro:
    - "Seu cachorro prefere passeio de manhã ou de tarde?"
    - "Qual é o brinquedo favorito do seu cachorro?"
    - "Banho em casa ou no pet shop: qual você escolhe?"
    - "Seu cachorro dorme na cama, no chão ou na caminha?"
    - "Qual comando seu cachorro obedece melhor?"
  filhote:
    - "Qual foi a maior bagunça do seu filhote até agora?"
    - "Seu filhote já aprendeu a fazer xixi no lugar certo? Sim ou ainda não?"
    - "Como se chama o seu filhote?"
    - "Quantos meses tem o seu filhote?"
    - "Qual foi a primeira coisa que seu filhote destruiu?"
  ansiedade_separacao:
    - "Seu cachorro percebe quando você pega a chave? Sim ou não?"
    - "Quanto tempo seu cachorro fica sozinho por dia?"
    - "Seu cachorro late ou chora quando você sai? Conta aqui."
    - "O que ajuda mais: brinquedo recheável, passeio antes de sair ou música?"
    - "Qual horário do dia é o mais difícil para vocês?"
  saude_alimentacao:
    - "Você já conferiu a lista de alimentos proibidos para o seu pet? Sim ou não?"
    - "Seu pet come ração seca, úmida ou os dois?"
    - "Quantas vezes por dia você alimenta o seu pet?"
    - "Qual dúvida sobre cuidado com o pet você mais tem? Conta aqui."
    - "Seu pet já foi ao veterinário este ano? Só pergunta, sem julgamento."
isca_digital:
  status: "PROPOSTA, aguardando decisao do Allan (nada ativado)"
  fase1: "Instagram, ManyChat gratis (limite a reconferir no cadastro): comentar GUIA -> resposta no comentario + 1 DM com o link do artigo. Sem coletar e-mail."
  regras: "META (instantdm.com, 28/08/2026, fonte secundaria): resposta privada a comentario = 1 mensagem, ate 7 dias; conversa so segue se a pessoa responder (janela 24h); so contata quem agiu primeiro. TIKTOK: nao automatizar. LGPD: e-mail so com consentimento claro e politica de privacidade."
  venda: "Sozinho em Casa so na DM, depois que a pessoa responder, 1 linha, sem pressao."
regras_teste:
  versao_16_10_mudanca: "Allan mandou mudar o caminho ja (16/10). Fator de decisao = RETENCAO (tempo medio como % da duracao, skip rate IG), lida em 24-48h; views absolutos so apoio. Horario congelado."
  fator_por_vez: true
  n_posts_por_variacao: {formato: 6, leitura_inicial: 3}
  aprova_se: "em >=4 de 6 posts: IG skip <=55%, TikTok tempo medio >=50% da duracao, FB tempo medio >=40% da duracao; e comentario de terceiro >=1 em 2 de 6"
  reprova_se: "nos 3 primeiros posts: skip IG >=75% E tempo medio <30% da duracao -> abandona o formato"
  meio_termo: "ajustar abertura e repetir 3 posts"
  testes:
    T1_meme_fofura: {duracao_s: "8-12", abertura: "cena + texto na tela no 1o segundo", n: 6, redes: [facebook, instagram, tiktok], em_andamento: "9 memes agendados FB 12h/IG 13h desde 17/10, 2 no TikTok 17:10, 8 novos do Humorista"}
    T2_voz_do_pet: {duracao_s: "15-20", formato: "Duda dubla o pensamento do animal numa situacao do artigo; fecha com 1 linha de dica", n: 6, redes: [facebook, instagram, tiktok], racas: "raca citada = raca do video"}
    T3_corte_resultado_primeiro: {duracao_s: "15-20", formato: "mesmo artigo do explicador, resultado no segundo 0, sem titulo", n: 6, controle: "explicador original publicado", redes: [tiktok, instagram, facebook]}
  parar:
    - "explicador 37-55s como formato unico: no maximo 1 a cada 3 posts"
    - "abertura 'Esse erro ta silenciosamente...' (banida) e 'Para de...' mais de 1x por semana"
    - "teste de horario com o mesmo video"
    - "link no perfil; 5 hashtags no FB; alegacao 'pode ser fatal' / 'atrapalhando o crescimento'"
  arquivos_a_mudar: ["config/estilo_viral.yaml (duracao 8-20s, abertura no segundo 0)", "prompts de roteiro e video", "prompt de legenda (3 hashtags FB, sem link no perfil)", "painel semanal (tempo medio em % e skip rate)"]
  posts_recentes: "menos de 48h = parciais, mas a leitura de retencao em 24-48h e permitida para decidir formato"
  metas_2_semanas:   # hipoteses, nao promessas
    tiktok: {tempo_medio_pct_duracao: 0.5, curtidas_por_view: 0.05, shares_por_post: 0.5, comentarios_por_post: 1}
    facebook: {tempo_medio_pct_duracao: 0.4, reacoes_por_view: 0.02, comentarios_terceiros_por_semana: 1}
    instagram: {skip_rate_max: 0.55, curtidas_por_post: 2, salvamentos_mais_shares_por_semana: 1}
  utm: "utm_source=facebook|instagram|tiktok por rede para medir cliques do 1o comentario"
