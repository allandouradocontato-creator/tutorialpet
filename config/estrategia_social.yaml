  posts_recentes: "menos de 48h entram como parciais, nunca ficam de fora"
  metas_2_semanas:   # hipóteses a partir dos números de 09/10, não promessas
    tiktok: {views_24h_mediana: 300, curtidas_por_view: 0.05, comentarios_terceiros_por_post: 1}
    facebook: {views_24h_mediana: 300, reacoes_por_view: 0.01, comentarios_terceiros_por_semana: 1}
    instagram: {alcance_mediana: 50, curtidas_por_post: 2, salvamentos_mais_shares_por_semana: 1}
  utm: "utm_source=facebook|instagram|tiktok por rede para medir cliques do 1º comentário"
