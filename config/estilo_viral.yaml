# Guia de estilo viral — alimentado pelo "Caçador de estilo viral" (agente de referências) a partir dos Reels/TikToks
# de pet que MAIS engajam. Estudo 6 (15/10/2026): TikTok lido via busca (a página da tag #cachorrofofo só mostra vídeos de 2022-2025, sem nada recente). Instagram (tag) e Reels do Facebook: sem leitura pública/login ativo -> registrado, não contornado.
# Cor/iluminação NÃO medidas por vídeo (só texto/métricas lidos, nenhum vídeo assistido); números de cor/corte/música mantidos do estudo 3/4/5.
# A fábrica de vídeo (agents/17_video/montar_video6.py) lê estes números; o caçador só atualiza este arquivo.
# Achados do estudo 6: (11) @nill.sill217 (gato, 13s, 14/10): 1,8M views, 7,3% shares/views (132k), 20,5% curtidas, 29k salvamentos, som original, vertical 1080x1920 nítido; legenda só com hashtags (#petsfofos #gatinhosfofos) -> NÃO precisa de texto longo.
# (12) @salsisalsicha (9s, 24/09): 1,8M views, 9,6% curtidas, ~1% shares, som original, legenda 'vidão' + #fy #viral #trend; (13) @.patrulha.dos.dog (15s, 29/09, 4,7k seguidores -> 438k views = ~94x os seguidores): 1,9% shares, som original, legenda só hashtag.
# (14) Os 3 novos são 100% SOM ORIGINAL, 9-15s, plano único, legenda mínima (só hashtags). O que tem música de biblioteca (Moonberry Carousel, music box) teve só 7k views -> música não é o motor; o bicho é.
# (15) Contas pequenas/médias viralizam: 3 de 3 novos têm 4,7k-70k seguidores. (16) Busca recente por 'gato/cachorro fofo' traz também ADOÇÃO/DOAÇÃO (@alertabrasilbr) e vídeos de 50-61s com pessoas (@babiepaulinha, 358k views, 61s, música 'A Thousand Years'): fora do critério A/E, ignorados.
# (17) NOSSOS vídeos no TikTok têm 38-54s (referências: 9-15s) e 191-577 views, 0-2 shares; nossos Reels do Instagram: 22-101 views, 0-3 curtidas, 0 shares. A DURAÇÃO é a maior diferença mensurável entre nós e as referências.
# Achados do estudo 3: (1) 7-15s domina; os de maior taxa de share são curtos (oakley 7s: 7,5% shares/views; sunithedapple 15s: 6,2%);
# (2) quase tudo é SOM ORIGINAL, plano único limpo (0-2 cortes), bicho em close olhando a câmera; (3) contas pequenas com views enormes
# (coco.thefluffypom 5,9k seguidores -> 934k views, 4,3% shares) mostram que o vídeo viraliza, não a conta; (4) tag #gatofofo recente é dominada por
# spam de baixo engajamento (<500 views); (5) vídeos nossos com gancho de pergunta/promessa (Facebook ~210 views) superam os de lista/instrução (~10 views).
# Achados do estudo 4: (6) #petsbrasil e #dicasparacachorro são dominadas por vídeos de 30-90s e anúncios de loja; nos últimos 60 dias só 2 vídeos de 7-20s apareceram, e são "dicas/utilidade"
# com shares/views de 0,35-0,67% (abaixo da meta de 1%) -> conteúdo educativo curto funciona menos que fofura/rotina; (7) o que bomba em 60s+ (pinscher_lury 3,3M views, 3,6% shares) é humor/rotina com som original,
# confirmando "som original + plano único"; (8) nossos Reels do Instagram de 28-30/09 (>48h) tiveram 0-2 views cada (ver fechar_ciclo): conta nova, sem tração orgânica ainda.
# Achados do estudo 5: (9) @norcianic (863 seguidores!) fez 718k views em 8s com 9,2% shares/views e 17,9% curtidas/views: filhote de dachshund crescendo em time-lapse, legenda com CTA de curtir,
# trilha instrumental lenta (piano valsa) -> prova de que ritmo visual rápido (transformação em 8s) + trilha calma e curta funciona; replicar: 8s, uma transformação visível, texto/legenda curta com CTA.
# (10) a tag #cachorrofofo continua com a mesma "moda": filhote/cão em close, 7-15s, som original ou piano/instrumental, ganchos 'Atenção: nível de fofura', 'Já manda pro seu papai'.
versao: 6
atualizado_em: "2026-10-15"
criterios:
  nicho: "pets (cães e gatos); cuidado, comportamento, rotina e fofura saudável. Fora: animal doente, abrigo, doação, resgate, pessoas em destaque"
  plataformas: [tiktok, instagram_reels, facebook_reels]   # o mesmo vídeo sai nas 3 redes
  recencia_dias: 30   # evergreen mais antigo só se marcado "evergreen"
  desempenho_relativo: "shares/views >= 1% (peso maior), curtidas/views >= 8%, comentários e salvamentos desempatam; priorizar contas pequenas/médias com views muito acima dos seguidores"
  duracao_s: [7, 15]
  gancho: "1º segundo: close do bicho, texto na tela de até 6 palavras, pergunta ou promessa curta"
  campos_por_video: [link, perfil, views, curtidas, shares, duracao, musica_bpm, tipo_gancho, ritmo_cortes, cor_luz, cta]
  meta_referencias: "15 ativas, mínimo 5 por rede quando houver acesso; rede bloqueada = registrar e não contornar"
  fechar_ciclo: "comparar com métricas próprias (Metricool brandId 7123441) de posts com mais de 48h"
  ferramentas: "somente gratuitas"
cor:
  saturacao: 1.15        # 1.0 = original; cores vivas, pelagem em destaque (sem estourar)
  brilho: 0.05           # rosto do bicho bem iluminado, luz natural/contraluz suave
  contraste: 1.06
  temperatura: quente    # quente | neutra | fria (só referência para o caçador; ainda não aplicada)
cortes:
  cortes_por_cena: 2     # a moda é plano único limpo ou 1-2 cortes; menos cortes = mais retenção em 10-12s (os 3 novos do estudo 6 são plano único)
  duracao_media_corte_s: 2.0
musica:
  bpm_alvo: [100, 125]
  energia: media_alta    # leve/brincalhona; instrumental ou som original sob a narração
  volume_sob_narracao: 0.14   # antigo (ganho cru); a fábrica agora usa volume_db
  faixas_energeticas:      # escolhidas pelo Allan em 07/10/2026 (as de maior energia da biblioteca); a fábrica só alterna entre estas
    - lnplusmusic-happy-happy-music-611028.mp3
    - alex-morgan-upbeat-591314.mp3
    - starostin-pets-music-dog-cat-puppy-kitty-shelter-background-intro-theme-259661.mp3
    - gr0za-happy-happy-music-569345.mp3
  volume_db: -7            # música normalizada (-14 LUFS) menos 7 dB; abaixa sozinha quando a Duda fala (ducking) e sobe nas pausas
gancho:
  primeiros_segundos: "close do bicho fofo olhando/mexendo na câmera no 1º segundo + texto de até 6 palavras em forma de pergunta/promessa/alerta de fofura ('nível de fofura perigoso', 'seu cachorro faz isso?'); vídeo total de 8 a 12s (máx. 15s; NUNCA acima de 20s: nossos de 38-54s não passam de 577 views); plano único ou 2 cortes; tom alegre (evitar filhote de rua/triste); CTA de compartilhar ('manda pro seu papai') na legenda"
fechar_ciclo:
  data: "2026-10-15"
  fonte: "Metricool brandId 7123441: Reels do Instagram de 08/10 a 13/10 (>48h) e vídeos TikTok @tutorialpetbr de 08-10/10 lidos na página pública"
  instagram_reels: "6 Reels no período: views 22-101, 0-3 curtidas, 0 shares, 0 salvamentos, 0-1 comentário; tempo médio assistido 2,9-4,6s. Mais views: 'Seu gato raspa o chão depois de comer?' (101 views, 3 curtidas) e 'Seu gato bebe pouca água? Descubra como resolver isso!' (99 views, 2 curtidas). Melhor que 28/09-07/10 (0-6 views), mas ainda 0 shares"
  tiktok: "4 vídeos de 08-10/10: 191-577 views, 10-30 curtidas, 0-2 shares, duração 38-54s (!). Melhor: 'Como fazer o gato beber mais água' (577 views, 30 curtidas, 0 shares)"
  facebook: "Reels publicados em 08-10/10 sem leitura de métricas nesta rodada"
  alerta_operacional: "A partir de 10/10 11:00 TODOS os posts agendados (Instagram, TikTok e Facebook de 10/10, 11/10 e 12/10) estão com status ERROR 'You have reached your Metricool account limit.' -> nada foi publicado desde 10/10; verificar plano/limite do Metricool"
  aproxima_das_referencias: "legenda curta e só hashtags nos Reels (como as refs de 9-15s); tempo assistido ~3-4,6s no IG (a ref precisa de gancho nos 3 primeiros s); link só no 1º comentário"
  nao_aproxima: "duração (38-54s vs 9-15s das refs) e conteúdo: nossos são dica/lista de gato com narração, as refs são o bicho em plano único com som original, sem instrução; 0 shares contra 1-7% das refs; ganchos de pergunta de dica ('Seu gato bebe pouca água?') geram 2-3 curtidas, nenhum motivo emocional de compartilhar"
  fazer_diferente_amanha:
    - "Cortar a duração: vídeo de 8-12s (máx. 15s), uma ação fofa em plano único; hoje fazemos 38-54s e a retenção cai antes de 5s"
    - "Testar 1 vídeo de gato/cachorro em close, 1080x1920 nítido, sem narração longa, legenda só com 1 linha + hashtags (estilo @nill.sill217: 7,3% shares)"
    - "Som original/ambiente do próprio bicho ou trilha instrumental bem baixa; não depender de música em alta"
    - "Reservar dicas (educativo) para 1 em cada 4 vídeos; priorizar rotina/comportamento fofo; CTA 'manda pro seu papai'"
    - "Resolver o limite do Metricool (posts com ERROR desde 10/10) antes de gerar mais vídeos"
