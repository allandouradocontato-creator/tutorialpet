# Guia de estilo viral — alimentado pelo "Caçador de estilo viral" (agente de referências) a partir dos Reels/TikToks
# de pet que MAIS engajam. Estudo 5 (08/10/2026): TikTok #cachorrofofo e #gatofofo relidos. Quase todos os vídeos da tag já eram os do estudo 4; só 1 novo dentro de 30 dias
# com métricas lidas (@norcianic, 19/09). Em #gatofofo, 3 vídeos recentes, mas as páginas deles não abriram (tela de espera do TikTok) -> registrado, não contornado.
# Instagram e Reels do Facebook: não lidos (sem leitura pública/login). Cor/iluminação NÃO medidas por vídeo; números de cor/corte/música mantidos do estudo 3/4.
# A fábrica de vídeo (agents/17_video/montar_video6.py) lê estes números; o caçador só atualiza este arquivo.
# Achados do estudo 3: (1) 7-15s domina; os de maior taxa de share são curtos (oakley 7s: 7,5% shares/views; sunithedapple 15s: 6,2%);
# (2) quase tudo é SOM ORIGINAL, plano único limpo (0-2 cortes), bicho em close olhando a câmera; (3) contas pequenas com views enormes
# (coco.thefluffypom 5,9k seguidores -> 934k views, 4,3% shares) mostram que o vídeo viraliza, não a conta; (4) tag #gatofofo recente é dominada por
# spam de baixo engajamento (<500 views); (5) vídeos nossos com gancho de pergunta/promessa (Facebook ~210 views) superam os de lista/instrução (~10 views).
# Achados do estudo 4: (6) #petsbrasil e #dicasparacachorro são dominadas por vídeos de 30-90s e anúncios de loja; nos últimos 60 dias só 2 vídeos de 7-20s apareceram, e são "dicas/utilidade"
# com shares/views de 0,35-0,67% (abaixo da meta de 1%) -> conteúdo educativo curto funciona menos que fofura/rotina; (7) o que bomba em 60s+ (pinscher_lury 3,3M views, 3,6% shares) é humor/rotina com som original,
# confirmando "som original + plano único"; (8) nossos Reels do Instagram de 28-30/09 (>48h) tiveram 0-2 views cada (ver fechar_ciclo): conta nova, sem tração orgânica ainda.
# Achados do estudo 5: (9) @norcianic (863 seguidores!) fez 718k views em 8s com 9,2% shares/views e 17,9% curtidas/views: filhote de dachshund crescendo em time-lapse, legenda com CTA de curtir,
# trilha instrumental lenta (piano valsa) -> prova de que ritmo visual rápido (transformação em 8s) + trilha calma e curta funciona; replicar: 8s, uma transformação visível, texto/legenda curta com CTA.
# (10) a tag #cachorrofofo continua com a mesma "moda": filhote/cão em close, 7-15s, som original ou piano/instrumental, ganchos 'Atenção: nível de fofura', 'Já manda pro seu papai'.
versao: 5
atualizado_em: "2026-10-08"
criterios:
  nicho: "pets (cães e gatos); cuidado, comportamento, rotina e fofura saudável. Fora: animal doente, abrigo, doação, resgate, pessoas em destaque"
  plataformas: [tiktok, instagram_reels, facebook_reels]   # o mesmo vídeo sai nas 3 redes
  recencia_dias: 30   # evergreen mais antigo só se marcado "evergreen"
  desempenho_relativo: "shares/views >= 1% (peso maior), curtidas/views >= 8%, comentários e salvamentos desempatam; priorizar contas pequenas/médias com views muito acima dos seguidores"
  duracao_s: [7, 15]
  gancho: "1º segundo: close do bicho, texto na tela de até 6 palavras, pergunta ou promessa curta"
  campos_por_video: [link, perfil, views, curtidas, shares, duracao, musica_bpm, tipo_gancho, ritmo_cortes, cor_luz, cta]
  meta_referencias: "15 ativas, mínimo 5 por rede quando houver acesso; rede bloqueada = registrar e não contornar"
  fechar_ciclo: "comparar com métricas próprias (Metricool brandId 7123441) de posts com mais de 48h"
  ferramentas: "somente gratuitas"
cor:
  saturacao: 1.15        # 1.0 = original; cores vivas, pelagem em destaque (sem estourar)
  brilho: 0.05           # rosto do bicho bem iluminado, luz natural/contraluz suave
  contraste: 1.06
  temperatura: quente    # quente | neutra | fria (só referência para o caçador; ainda não aplicada)
cortes:
  cortes_por_cena: 2     # a moda é plano único limpo ou 1-2 cortes; menos cortes = mais retenção em 10-12s
  duracao_media_corte_s: 2.0
musica:
  bpm_alvo: [100, 125]
  energia: media_alta    # leve/brincalhona; instrumental ou som original sob a narração
  volume_sob_narracao: 0.14   # antigo (ganho cru); a fábrica agora usa volume_db
  faixas_energeticas:      # escolhidas pelo Allan em 07/10/2026 (as de maior energia da biblioteca); a fábrica só alterna entre estas
    - lnplusmusic-happy-happy-music-611028.mp3
    - alex-morgan-upbeat-591314.mp3
    - starostin-pets-music-dog-cat-puppy-kitty-shelter-background-intro-theme-259661.mp3
    - gr0za-happy-happy-music-569345.mp3
  volume_db: -7            # música normalizada (-14 LUFS) menos 7 dB; abaixa sozinha quando a Duda fala (ducking) e sobe nas pausas
gancho:
  primeiros_segundos: "close do bicho fofo olhando/mexendo na câmera no 1º segundo + texto de até 6 palavras em forma de pergunta/promessa/alerta de fofura ('nível de fofura perigoso', 'seu cachorro faz isso?'); vídeo total de 8 a 12s (máx. 15s); plano único ou 2 cortes; tom alegre (evitar filhote de rua/triste); CTA de compartilhar ('manda pro seu papai') na legenda"
fechar_ciclo:
  data: "2026-10-08"
  fonte: "Metricool brandId 7123441, Reels do Instagram de 28/09 a 07/10 (publicados há mais de 48h: 28-30/09 e 06/10; os de 07/10 são parciais)"
  instagram_reels: "10 Reels no período, 0 curtidas/shares/salvamentos/comentários em todos; views 0-6 cada. Mais views: 'Quer ensinar seu gato a usar a caixa de areia...' (6 views, 3,9s assistidos), 'Com quantos meses o cachorro pode sair na rua?' (5 views, 8,6s), 'Seu cachorro aguenta quantas horas sozinho?' (4 views, 6,7s). Tempo médio assistido 4-9s nos que tiveram view. Mudança de 07/10 (link só no 1º comentário, legenda curta) NÃO trouxe curtida/share ainda; amostra pequena"
  tiktok: "Metricool não retornou linhas do TikTok para o período"
  aproxima_das_referencias: "legenda curta em pergunta (como 'Já manda pro seu papai' / 'Voltou do passeio?'); link no 1º comentário; duração do tempo assistido (~8s) compatível com vídeos de 8-10s"
  nao_aproxima: "ganchos são perguntas de DICA/lista, não close de bicho fofo com emoção; referências com 1%+ shares são fofura/transformação sem texto de produto; 0 shares e 0 curtidas mostram que ainda não há motivo emocional para compartilhar; sem música em alta e sem prova de close no 1º segundo"
  fazer_diferente_amanha:
    - "Testar 1 vídeo no formato da ref norcianic: 8s, uma transformação/ação fofa visível (filhote crescendo, acordando, correndo), legenda de 1 linha com CTA ('manda pro seu papai')"
    - "Close do bicho feliz no 1º segundo + texto de até 6 palavras; nada de lista/instrução no gancho"
    - "Trilha instrumental (piano/brincalhona) baixa sob a narração; usar as faixas de audios_em_alta.yaml no Instagram"
    - "Publicar o MESMO vídeo no TikTok e Facebook Reels hoje (Instagram sozinho tem 0 tração e TikTok não tem dado)"
    - "Reservar dicas (educativo) para 1 em cada 4 vídeos; priorizar rotina/comportamento fofo"
