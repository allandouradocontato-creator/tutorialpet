# Guia de estilo viral — alimentado pelo "Caçador de estilo viral" (agente de referências) a partir dos Reels/TikToks
# de pet que MAIS engajam. Estudo 3 (07/10/2026): metadados (views/curtidas/shares/duração/música/data) lidos em #cachorrofofo,
# #gatofofo, #petsbrasil e #cachorrosfofos no TikTok. Instagram: busca por hashtag sem conteúdo público legível (login/bloqueio) — registrado, não contornado.
# Reels do Facebook: não lidos nesta rodada. Cor/iluminação NÃO foram medidas por vídeo (só metadados); ajustes de cor seguem conservadores.
# A fábrica de vídeo (agents/17_video/montar_video6.py) lê estes números; o caçador só atualiza este arquivo.
# Achados do estudo 3: (1) 7-15s domina; os de maior taxa de share são curtos (oakley 7s: 7,5% shares/views; sunithedapple 15s: 6,2%);
# (2) quase tudo é SOM ORIGINAL, plano único limpo (0-2 cortes), bicho em close olhando a câmera; (3) contas pequenas com views enormes
# (coco.thefluffypom 5,9k seguidores -> 934k views, 4,3% shares) mostram que o vídeo viraliza, não a conta; (4) tag #gatofofo recente é dominada por
# spam de baixo engajamento (<500 views); (5) vídeos nossos com gancho de pergunta/promessa (Facebook ~210 views) superam os de lista/instrução (~10 views).
versao: 3
atualizado_em: "2026-10-07"
criterios:
  nicho: "pets (cães e gatos); cuidado, comportamento, rotina e fofura saudável. Fora: animal doente, abrigo, doação, resgate, pessoas em destaque"
  plataformas: [tiktok, instagram_reels, facebook_reels]   # o mesmo vídeo sai nas 3 redes
  recencia_dias: 30   # evergreen mais antigo só se marcado "evergreen"
  desempenho_relativo: "shares/views >= 1% (peso maior), curtidas/views >= 8%, comentários e salvamentos desempatam; priorizar contas pequenas/médias com views muito acima dos seguidores"
  duracao_s: [7, 15]
  gancho: "1º segundo: close do bicho, texto na tela de até 6 palavras, pergunta ou promessa curta"
  campos_por_video: [link, perfil, views, curtidas, shares, duracao, musica_bpm, tipo_gancho, ritmo_cortes, cor_luz, cta]
  meta_referencias: "15 ativas, mínimo 5 por rede quando houver acesso; rede bloqueada = registrar e não contornar"
  fechar_ciclo: "comparar com métricas próprias (Metricool brandId 7123441) de posts com mais de 48h"
  ferramentas: "somente gratuitas"
cor:
  saturacao: 1.15        # 1.0 = original; cores vivas, pelagem em destaque (sem estourar)
  brilho: 0.05           # rosto do bicho bem iluminado, luz natural/contraluz suave
  contraste: 1.06
  temperatura: quente    # quente | neutra | fria (só referência para o caçador; ainda não aplicada)
cortes:
  cortes_por_cena: 2     # a moda é plano único limpo ou 1-2 cortes; menos cortes = mais retenção em 10-12s
  duracao_media_corte_s: 2.0
musica:
  bpm_alvo: [100, 125]
  energia: media_alta    # leve/brincalhona; instrumental ou som original sob a narração
  volume_sob_narracao: 0.14
gancho:
  primeiros_segundos: "close do bicho fofo olhando/mexendo na câmera no 1º segundo + texto de até 6 palavras em forma de pergunta/promessa/alerta de fofura ('nível de fofura perigoso', 'seu cachorro faz isso?'); vídeo total de 10 a 12s (máx. 15s); plano único ou 2 cortes; tom alegre (evitar filhote de rua/triste); CTA de compartilhar ('manda pro seu papai') na legenda"
