# Guia de estilo viral — alimentado pelo "Caçador de estilo viral" (agente de referências) a partir dos Reels/TikToks
# de pet que MAIS engajam. Estudo 2 (07/10/2026): metadados (views/curtidas/shares/duração/música/data) de ~90 vídeos do TikTok
# (#cachorrofofo, #gatofofo, #filhotedecachorro). Instagram: sem views públicas nos Reels, não usado nesta rodada.
# Cor/iluminação NÃO foram medidas por vídeo (só metadados); ajustes de cor seguem conservadores. Rever com análise de frames.
# A fábrica de vídeo (agents/17_video/montar_video6.py) lê estes números; o caçador só atualiza este arquivo.
# Achados do estudo 2: (1) 10-15s domina os virais recentes (13s=5,8M views, 15s=2,6M, 12s=17M); (2) maioria usa SOM ORIGINAL;
# quando há música é instrumental brincalhona (Eitan Epstein Music: 6,5M e 6,9M views) ou box-music suave; (3) plano único ou 2-3 cortes,
# bicho em close olhando a câmera; (4) hashtag #filhotedecachorro hoje é dominada por spam de filhote de rua (baixo engajamento) — evitar esse tom triste.
versao: 2
atualizado_em: "2026-10-07"
cor:
  saturacao: 1.18        # 1.0 = original; cores vivas, pelagem em destaque
  brilho: 0.05           # rosto do bicho bem iluminado, luz natural/contraluz suave
  contraste: 1.07
  temperatura: quente    # quente | neutra | fria (só referência para o caçador; ainda não aplicada)
cortes:
  cortes_por_cena: 3     # padrão da moda: 10-15s, 1 enquadramento + 2-3 cortes
  duracao_media_corte_s: 1.5
musica:
  bpm_alvo: [100, 125]
  energia: media_alta    # leve/brincalhona; instrumental ou som original sob a narração
  volume_sob_narracao: 0.16
gancho:
  primeiros_segundos: "close do bicho fofo olhando/mexendo na câmera no 1º segundo + frase curta de curiosidade ou alerta de fofura na tela (até 6 palavras) nos primeiros 2s; vídeo total de 10 a 15s; tom alegre (evitar filhote de rua/triste); pergunta ou CTA de compartilhar ('manda pro seu papai') na legenda"
