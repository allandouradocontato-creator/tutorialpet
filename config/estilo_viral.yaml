# Guia de estilo viral — alimentado pelo "Caçador de estilo viral" (agente de referências) a partir dos Reels/TikToks
# de pet que MAIS engajam. Estudo 1 (07/10/2026): metadados de ~24 vídeos do TikTok #cachorrofofo (views/curtidas/shares/duração/música).
# Instagram: logado, mas sem views públicas nos Reels; TikTok bloqueou outras hashtags (Access Denied) — não contornado.
# Cor/iluminação NÃO foram medidas por vídeo (só metadados): ajustes de cor são conservadores. Rever no próximo estudo.
# A fábrica de vídeo (agents/17_video/montar_video6.py) lê estes números; o caçador só atualiza este arquivo.
versao: 1
atualizado_em: "2026-10-07"
cor:
  saturacao: 1.15        # 1.0 = original; leve aumento (vídeos virais de pet: cores vivas, pelagem em destaque)
  brilho: 0.04           # rosto do bicho bem iluminado, luz natural/contraluz suave
  contraste: 1.06
  temperatura: quente    # quente | neutra | fria (só referência para o caçador; ainda não aplicada)
cortes:
  cortes_por_cena: 3     # padrão da moda: vídeos curtos (7-10s) de ~1 enquadramento + 2-3 cortes
  duracao_media_corte_s: 1.5
musica:
  bpm_alvo: [100, 125]
  energia: media_alta    # leve/animada; instrumental ou som original por baixo da narração (top vídeos usam som original ou instrumental suave)
  volume_sob_narracao: 0.18
gancho:
  primeiros_segundos: "close do bicho fofo olhando/mexendo na câmera no 1º segundo + frase curta de curiosidade ou alerta de fofura na tela (até 6 palavras) nos primeiros 2s; vídeo total de 7 a 10s rende mais compartilhamentos"
